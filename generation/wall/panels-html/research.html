<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_panel.css">
<style>
body{--bg:linear-gradient(150deg,#FCE45C 0%,#F6CB2E 100%);color:#1B1606}
.big{position:absolute;left:44px;top:40px;width:330px;height:330px}
.name{position:absolute;left:400px;top:120px}
.name b{display:block;font:800 60px/1 'Inter Tight';letter-spacing:-.035em}
.name .live{--pill:#1B1606;color:#FCE45C}
h1{position:absolute;left:64px;top:430px;width:760px}
.sub{position:absolute;left:64px;top:680px;width:600px;color:#5A4A0A}
.prog{position:absolute;left:64px;top:840px;width:640px;--track:rgba(27,22,6,.14);--fill:#1B1606}
.opts{position:absolute;left:860px;top:60px;width:676px;display:grid;gap:22px}
.o{display:flex;align-items:center;gap:24px;height:272px;padding:0 28px 0 24px;border-radius:32px;background:#fff;box-shadow:0 30px 60px -28px rgba(80,60,0,.45)}
.o .ph{flex:none;width:200px;height:220px;border-radius:22px;position:relative;overflow:hidden}
.o .ph::after{content:"";position:absolute;left:-30%;top:-40%;width:120%;height:120%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.45),transparent)}
.o .t{flex:1;min-width:0}
.o .t b{display:block;font:800 31px/1.15 'Inter Tight';letter-spacing:-.02em}
.o .t small{display:block;margin-top:8px;font:500 21px/1.3 Inter;color:#6B6450}
.stars{display:flex;gap:4px;margin-top:14px;color:#F59E0B}
.stars i.ic{width:28px;height:28px}
.stars i.ic svg{fill:currentColor}
.o .tag{margin-top:16px}
.o .n{position:absolute;left:14px;top:14px;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#fff;font:800 22px/1 'Inter Tight';z-index:1}
</style></head><body>
<div class="big face" data-shell="#1F1F22" data-rim="#F5C518" data-eye="#FFE36E" data-mood="big" data-icon="search" data-extra="antenna" data-led="#FFFFFF" data-shadow=".25"></div>
<div class="name"><b>Research agent</b><span class="live">Reading reviews</span></div>
<h1>Found your<br>3 best options.</h1>
<p class="sub">Read 120 reviews and compared them, so you don’t have to.</p>
<div class="prog"><span>Short list ready</span><span class="track"><i style="width:100%"></i></span></div>
<div class="opts">
  <div class="o"><span class="ph" style="background:linear-gradient(150deg,#60A5FA,#1D4ED8)"><span class="n">1</span></span><span class="t"><b>Lakeside loft</b><small>Quiet, great light, fits 40 people</small><span class="stars"><i class="ic" data-i="star"></i><i class="ic" data-i="star"></i><i class="ic" data-i="star"></i><i class="ic" data-i="star"></i><i class="ic" data-i="star"></i></span><span class="tag g"><i class="ic" data-i="check" data-w="3.2"></i>Top pick</span></span></div>
  <div class="o"><span class="ph" style="background:linear-gradient(150deg,#F472B6,#BE185D)"><span class="n">2</span></span><span class="t"><b>Rooftop garden</b><small>Best view, a short walk away</small><span class="stars"><i class="ic" data-i="star"></i><i class="ic" data-i="star"></i><i class="ic" data-i="star"></i><i class="ic" data-i="star"></i><i class="ic" data-i="star"></i></span><span class="tag g"><i class="ic" data-i="check" data-w="3.2"></i>Shortlisted</span></span></div>
  <div class="o"><span class="ph" style="background:linear-gradient(150deg,#34D399,#047857)"><span class="n">3</span></span><span class="t"><b>Old town hall</b><small>Most charm, books up fast</small><span class="stars"><i class="ic" data-i="star"></i><i class="ic" data-i="star"></i><i class="ic" data-i="star"></i><i class="ic" data-i="star"></i><i class="ic" data-i="star" style="opacity:.3"></i></span><span class="tag g"><i class="ic" data-i="check" data-w="3.2"></i>Shortlisted</span></span></div>
</div>
<script src="_agent.js"></script>
</body></html>
