<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1000px;overflow:hidden}
body{font-family:'Plus Jakarta Sans',Inter,sans-serif;background:#FF2D78;color:#fff;position:relative}
body:before{content:"";position:absolute;inset:0;background:radial-gradient(900px 700px at 15% 110%,#FF8A3D 0%,rgba(255,138,61,0) 60%),radial-gradient(800px 600px at 100% 0%,#B026FF 0%,rgba(176,38,255,0) 60%)}
.top{position:relative;height:100px;display:flex;align-items:center;padding:0 60px;gap:16px}
.logo{width:54px;height:54px;border-radius:16px;background:#fff;display:grid;place-items:center}
.brand{font:800 30px 'Plus Jakarta Sans';letter-spacing:-.02em}
.pill{margin-left:auto;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);border-radius:999px;font:700 22px 'Plus Jakarta Sans';padding:12px 24px;display:flex;gap:10px;align-items:center}
.left{position:absolute;left:60px;top:190px;width:600px}
.eyebrow{font:800 22px 'Plus Jakarta Sans';letter-spacing:.16em;color:#FFE0EC}
h1{font:800 108px/.95 'Plus Jakarta Sans';letter-spacing:-.045em;margin-top:24px}
.sub{font:600 29px/1.38 'Plus Jakarta Sans';color:#FFE3EE;margin-top:28px;width:520px}
.cta{display:inline-flex;align-items:center;gap:12px;margin-top:40px;background:#fff;color:#E0115F;font:800 25px 'Plus Jakarta Sans';border-radius:999px;padding:18px 32px}
.board{position:absolute;right:56px;top:120px;width:820px;height:840px;background:#fff;border-radius:34px;box-shadow:0 30px 60px rgba(90,0,40,.35);padding:30px;color:#2A0A1A}
.bh{display:flex;align-items:center;gap:16px}
.bh .av{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#FF2D78,#FF8A3D);display:grid;place-items:center;font:800 24px 'Plus Jakarta Sans';color:#fff;border:4px solid #fff;box-shadow:0 0 0 3px #FF2D78}
.bh b{font:800 26px 'Plus Jakarta Sans';display:block}
.bh small{font:600 19px 'Plus Jakarta Sans';color:#9A6A80}
.week{margin-left:auto;display:flex;gap:10px}
.week span{width:46px;height:56px;border-radius:14px;background:#FFF0F5;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 15px 'Plus Jakarta Sans';color:#C25A85}
.week span i{width:9px;height:9px;border-radius:50%;background:#FF2D78;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}
.tile{height:224px;border-radius:22px;position:relative;overflow:hidden;padding:18px;display:flex;flex-direction:column;justify-content:flex-end}
.tile .e{position:absolute;right:14px;top:10px;font-size:78px;line-height:1}
.tile b{font:800 30px/1.02 'Plus Jakarta Sans';letter-spacing:-.025em;position:relative}
.tile .s{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.92);color:#2A0A1A;font:800 15px 'Plus Jakarta Sans';border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:6px}
</style></head><body>
<div class="top">
  <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="#FF2D78"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.4 3.2 5 6.6 5c2.1 0 3.6 1.2 5.4 3.1C13.8 6.2 15.3 5 17.4 5c3.4 0 5.6 3.4 4.1 6.8C19.5 16.4 12 21 12 21z"/></svg></div>
  <div class="brand">Social Planner</div>
  <div class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>30 posts scheduled</div>
</div>
<div class="left">
  <div class="eyebrow">THIS MONTH</div>
  <h1>Posts,<br>planned<br>and posted.</h1>
  <p class="sub">Written, designed and scheduled for you, every single day.</p>
  <div class="cta">See the calendar <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E0115F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
</div>
<div class="board">
  <div class="bh"><div class="av">MB</div><div><b>Maya's Bakery</b><small>Next post · today 9:00 AM</small></div>
    <div class="week"><span>M<i></i></span><span>T<i></i></span><span>W<i></i></span><span>T<i></i></span><span>F<i></i></span><span>S<i></i></span><span>S<i></i></span></div></div>
  <div class="tiles" id="t"></div>
</div>
<script>
const T=[
 ['linear-gradient(150deg,#FFD166,#FF8A3D)','🥐','Fresh out<br>of the oven','#3A1400'],
 ['linear-gradient(150deg,#7B2FF7,#F107A3)','✨','New menu<br>this Friday','#fff'],
 ['linear-gradient(150deg,#06D6A0,#118AB2)','☕','Coffee +<br>croissant','#fff'],
 ['linear-gradient(150deg,#FF5E8A,#FF9EB5)','🎂','Order your<br>birthday cake','#fff'],
 ['linear-gradient(150deg,#FFF1C1,#FFC8DD)','🍓','Strawberry<br>season','#5A1030'],
 ['linear-gradient(150deg,#1B1B3A,#4B2C82)','🌙','Late-night<br>treats','#fff'],
 ['linear-gradient(150deg,#A0E7E5,#B4F8C8)','🥖','Behind<br>the scenes','#0B3B36'],
 ['linear-gradient(150deg,#FF8A3D,#FF2D78)','🎉','Thank you,<br>neighbors!','#fff'],
 ['linear-gradient(150deg,#FDE68A,#FCA5A5)','🍪','5 cookies<br>you\'ll love','#4A1505'],
];
document.getElementById('t').innerHTML=T.map(t=>`<div class="tile" style="background:${t[0]};color:${t[3]}"><div class="s"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF2D78" stroke-width="3.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Scheduled</div><div class="e">${t[1]}</div><b>${t[2]}</b></div>`).join('');
</script>
</body></html>
