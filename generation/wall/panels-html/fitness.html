<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1000px;overflow:hidden}
body{font-family:Inter,sans-serif;background:#111311;color:#fff;position:relative}
.top{position:relative;height:100px;display:flex;align-items:center;padding:0 60px;gap:16px;z-index:2}
.logo{width:54px;height:54px;border-radius:12px;background:#C6F432;display:grid;place-items:center}
.brand{font:400 34px Anton;letter-spacing:.04em}
.links{margin-left:70px;display:flex;gap:40px;font:700 21px Inter;color:#9CA39A;letter-spacing:.06em}
.links b{color:#fff}
.btn{margin-left:auto;background:#C6F432;color:#111311;border-radius:999px;font:800 21px Inter;padding:14px 28px;letter-spacing:.04em}
.art{position:absolute;right:-60px;top:40px;width:820px;height:820px}
.left{position:absolute;left:60px;top:160px;width:760px;z-index:2}
.tag{display:inline-flex;align-items:center;gap:10px;border:2px solid #C6F432;color:#C6F432;font:800 20px Inter;letter-spacing:.14em;border-radius:999px;padding:10px 20px}
h1{font:400 168px/.9 Anton;letter-spacing:.005em;margin-top:24px;text-transform:uppercase}
h1 em{font-style:normal;color:#C6F432}
.cls{position:absolute;left:60px;right:60px;bottom:56px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;z-index:2}
.c{background:#1D211C;border:2px solid #2C322A;border-radius:26px;padding:22px 24px;display:flex;align-items:center;gap:18px}
.c .ic{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;font-size:36px;flex:none}
.c b{font:400 32px Anton;letter-spacing:.03em;display:block}
.c small{font:600 19px Inter;color:#A3AA9F}
.c .bk{margin-left:auto;background:#C6F432;color:#111;font:800 17px Inter;border-radius:999px;padding:8px 14px;letter-spacing:.06em}
</style></head><body>
<svg class="art" viewBox="0 0 820 820">
  <defs><radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#C6F432"/><stop offset=".7" stop-color="#9BD11A"/><stop offset="1" stop-color="#6E9A0F"/></radialGradient></defs>
  <circle cx="420" cy="380" r="330" fill="url(#g)"/>
  <g stroke="#111311" stroke-width="14" stroke-linecap="round" opacity=".18"><path d="M120 640 L700 120"/><path d="M180 700 L760 180"/></g>
  <g transform="rotate(-24 420 380)">
    <rect x="200" y="350" width="440" height="60" rx="30" fill="#2A2F28"/>
    <rect x="160" y="250" width="90" height="260" rx="34" fill="#111311"/>
    <rect x="110" y="285" width="60" height="190" rx="26" fill="#1E231D"/>
    <rect x="590" y="250" width="90" height="260" rx="34" fill="#111311"/>
    <rect x="670" y="285" width="60" height="190" rx="26" fill="#1E231D"/>
    <rect x="175" y="270" width="16" height="220" rx="8" fill="#3A4237"/>
    <rect x="605" y="270" width="16" height="220" rx="8" fill="#3A4237"/>
  </g>
</svg>
<div class="top">
  <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="#111311"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></div>
  <div class="brand">PULSE STUDIO</div>
  <div class="links"><b>CLASSES</b><span>COACHES</span><span>MY PLAN</span></div>
  <div class="btn">MY BOOKINGS</div>
</div>
<div class="left">
  <div class="tag">⚡ AUTO-BOOKED FOR YOU</div>
  <h1>Your spot<br><em>is saved.</em></h1>
  <p style="font:600 28px/1.4 Inter;color:#B9C0B5;margin-top:22px;width:560px">Your favorite classes, booked the minute they open. Every week.</p>
</div>
<div class="cls">
  <div class="c"><div class="ic" style="background:#C6F432">🔥</div><div><b>HIIT</b><small>Mon · 7:00 AM</small></div><div class="bk">BOOKED</div></div>
  <div class="c"><div class="ic" style="background:#F9A8D4">🧘</div><div><b>YOGA FLOW</b><small>Wed · 6:30 PM</small></div><div class="bk">BOOKED</div></div>
  <div class="c"><div class="ic" style="background:#7DD3FC">🚴</div><div><b>SPIN</b><small>Fri · 7:00 AM</small></div><div class="bk">BOOKED</div></div>
</div>
</body></html>
