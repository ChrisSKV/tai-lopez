<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1000px;overflow:hidden}
body{font-family:Inter,sans-serif;background:#F4F1E4;color:#1F2A12;position:relative}
.top{height:100px;display:flex;align-items:center;padding:0 60px;gap:16px}
.logo{width:54px;height:54px;border-radius:16px;background:#4D7C0F;display:grid;place-items:center}
.brand{font:700 32px 'Fraunces';letter-spacing:-.01em}
.links{margin-left:70px;display:flex;gap:40px;font:600 22px Inter;color:#6B7556}
.links b{color:#1F2A12}
.av{margin-left:auto;width:56px;height:56px;border-radius:50%;background:#F59E0B;color:#fff;font:700 21px Inter;display:grid;place-items:center}
.head{position:absolute;left:60px;top:140px;width:880px}
h1{font:700 104px/.96 'Fraunces';letter-spacing:-.035em}
h1 em{font-style:italic;color:#4D7C0F}
.sub{font:500 28px Inter;color:#5E6849;margin-top:20px}
.days{position:absolute;left:60px;top:470px;width:900px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.day{background:#fff;border-radius:26px;padding:18px;height:230px;position:relative;box-shadow:0 10px 24px rgba(60,70,20,.08)}
.day .p{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:78px;margin:0 auto}
.day b{display:block;text-align:center;font:700 22px Inter;margin-top:12px}
.day small{position:absolute;left:16px;top:14px;font:800 15px Inter;letter-spacing:.12em;color:#8A9470}
.list{position:absolute;right:60px;top:140px;width:520px;height:820px;background:#1F3A0E;color:#F4F1E4;border-radius:32px;padding:34px}
.list h3{font:700 44px 'Fraunces';letter-spacing:-.01em}
.list p{font:500 21px Inter;color:#B5C79C;margin-top:6px}
.it{display:flex;align-items:center;gap:16px;padding:15px 0;border-bottom:2px solid rgba(244,241,228,.1);font:600 24px Inter}
.cb{width:36px;height:36px;border-radius:10px;background:#A3E635;display:grid;place-items:center;flex:none}
.it span{margin-left:auto;font-size:30px}
.go{position:absolute;left:34px;right:34px;bottom:34px;background:#A3E635;color:#1F3A0E;border-radius:999px;font:800 24px Inter;padding:22px;text-align:center}
</style></head><body>
<div class="top">
  <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 13h16a8 8 0 0 1-16 0zM8 9c0-2 2-2 2-4M13 9c0-2 2-2 2-4"/></svg></div>
  <div class="brand">Meals</div>
  <div class="links"><b>This week</b><span>Recipes</span><span>Groceries</span></div>
  <div class="av">KL</div>
</div>
<div class="head">
  <h1>Dinner's sorted,<br><em>all week.</em></h1>
  <p class="sub">Planned around your taste. Groceries already ordered.</p>
</div>
<div class="days" id="d"></div>
<div class="list">
  <h3>Grocery list</h3><p>Delivered Sunday, 10 AM</p>
  <div id="g" style="margin-top:18px"></div>
  <div class="go">✓ Order placed</div>
</div>
<script>
const D=[['MON','🥗','#DCFCE7','Greek salad'],['TUE','🍲','#FFE4D6','Veggie curry'],['WED','🌮','#FEF3C7','Fish tacos'],['THU','🍣','#E0F2FE','Salmon bowls'],['FRI','🍕','#FDE2E4','Pizza night'],['SAT','🥘','#FFEDD5','Paella'],['SUN','🍝','#EDE9FE','Pasta pesto'],['','🥞','#FCE7F3','Sunday pancakes']];
document.getElementById('d').innerHTML=D.slice(0,4).map(d=>`<div class="day"><small>${d[0]}</small><div class="p" style="background:${d[2]}">${d[1]}</div><b>${d[3]}</b></div>`).join('')+D.slice(4,8).map(d=>`<div class="day"><small>${d[0]}</small><div class="p" style="background:${d[2]}">${d[1]}</div><b>${d[3]}</b></div>`).join('');
const G=[['Avocados','🥑'],['Cherry tomatoes','🍅'],['Fresh salmon','🐟'],['Lemons','🍋'],['Basil','🌿'],['Eggs','🥚'],['Feta cheese','🧀']];
document.getElementById('g').innerHTML=G.map(g=>`<div class="it"><div class="cb"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F3A0E" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>${g[0]}<span>${g[1]}</span></div>`).join('');
</script>
</body></html>
