<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_panel.css">
<style>
body{--bg:#1E3A8A;color:#fff}
svg.bg{position:absolute;inset:0}
.left{position:absolute;left:64px;top:60px;width:720px}
.left h1{margin-top:66px;text-shadow:0 6px 30px rgba(60,20,60,.25)}
.who b{text-shadow:0 4px 20px rgba(60,20,60,.2)}
.it{left:860px;top:60px;width:676px;padding:34px 34px 14px;color:#1F2340}
.it .hd{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.it .hd b{font:800 36px/1 'Inter Tight';letter-spacing:-.02em}
.d{font:800 18px/1 Inter;letter-spacing:.14em;color:#9AA0BC;margin:26px 4px 6px}
.s{display:flex;align-items:center;gap:20px;height:114px;padding:0 4px;border-bottom:2px solid #F1F2F8}
.s .i{display:grid;place-items:center;flex:none;width:64px;height:64px;border-radius:20px}
.s .i i.ic{width:32px;height:32px}
.s .t{flex:1;min-width:0}
.s .t b{display:block;font:700 25px/1.2 Inter}
.s .t small{display:block;margin-top:5px;font:500 20px/1.2 Inter;color:#6B7194}
.s .ok{width:46px;height:46px}
.s.wip{background:#FFF7ED;margin:0 -34px;padding:0 38px;border:0}
</style></head><body>
<svg class="bg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B3FB8"/><stop offset=".38" stop-color="#C04BA8"/><stop offset=".64" stop-color="#FF7A59"/><stop offset=".8" stop-color="#FFC170"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F59E6B"/><stop offset=".25" stop-color="#7B5BB5"/><stop offset="1" stop-color="#1E2A6E"/></linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF3C4"/><stop offset=".55" stop-color="#FFD27A"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sk)"/>
  <circle cx="560" cy="780" r="250" fill="url(#sun)"/>
  <circle cx="560" cy="780" r="104" fill="#FFF0C2"/>
  <path d="M0 740 Q120 700 240 730 T520 740 L520 830 L0 830z" fill="#6E3A8E" opacity=".85"/>
  <rect y="820" width="1600" height="180" fill="url(#sea)"/>
  <g fill="#FFE2B0" opacity=".7"><rect x="440" y="846" width="240" height="6" rx="3"/><rect x="480" y="874" width="160" height="5" rx="2.5"/><rect x="510" y="900" width="100" height="5" rx="2.5"/></g>
  <g fill="#3B1F5E"><rect x="64" y="750" width="40" height="80"/><rect x="104" y="730" width="54" height="100"/><polygon points="100,730 131,702 162,730"/><rect x="162" y="762" width="44" height="68"/><rect x="214" y="740" width="30" height="90"/><rect x="244" y="780" width="60" height="50"/><rect x="304" y="766" width="36" height="64"/></g>
</svg>
<div class="left">
  <div class="who">
    <div class="face" data-shell="#FFFFFF" data-rim="#F97316" data-mood="happy" data-icon="plane" data-extra="antenna" data-led="#FDBA74" data-shadow=".3"></div>
    <div><b>Travel agent</b><span class="live" style="--pill:rgba(255,255,255,.22)">Planning your trip</span></div>
  </div>
  <h1>Lisbon trip,<br>all planned.</h1>
</div>
<div class="card it">
  <div class="hd"><b>Your trip</b><span class="tag g"><i class="ic" data-i="check" data-w="3.2"></i>3 of 4 done</span></div>
  <p class="d">FRIDAY</p>
  <div class="s"><span class="i" style="background:#E0E7FF;color:#4338CA"><i class="ic" data-i="plane" data-w="2"></i></span><span class="t"><b>Flight booked</b><small>Window seat, 9:40 AM</small></span><span class="ok"></span></div>
  <div class="s"><span class="i" style="background:#FCE7F3;color:#BE185D"><i class="ic" data-i="bed" data-w="2"></i></span><span class="t"><b>Hotel confirmed</b><small>Old town, sea view</small></span><span class="ok"></span></div>
  <p class="d">SATURDAY</p>
  <div class="s"><span class="i" style="background:#FFEDD5;color:#C2410C"><i class="ic" data-i="fork" data-w="2"></i></span><span class="t"><b>Dinner for 2, 8 PM</b><small>Table by the window</small></span><span class="ok"></span></div>
  <div class="s wip"><span class="i" style="background:#DCFCE7;color:#15803D"><i class="ic" data-i="pin" data-w="2"></i></span><span class="t"><b>Day trip to Sintra</b><small>Finding the best one…</small></span><i class="sp" data-c="#F97316" data-t="#FED7AA" data-p=".32"></i></div>
  <p class="d">SUNDAY</p>
  <div class="s" style="border:0"><span class="i" style="background:#E0F2FE;color:#0369A1"><i class="ic" data-i="clock" data-w="2"></i></span><span class="t"><b>Late checkout</b><small>Asked the hotel for you</small></span><span class="ok"></span></div>
</div>
<script src="_agent.js"></script>
</body></html>
