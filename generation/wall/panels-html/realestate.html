<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1000px;overflow:hidden}
body{font-family:Inter,sans-serif;background:#0E3B2E;color:#F6EFE2;position:relative}
.top{height:100px;display:flex;align-items:center;padding:0 60px;gap:16px;border-bottom:2px solid rgba(246,239,226,.12)}
.logo{width:54px;height:54px;border-radius:14px;background:#D9F99D;display:grid;place-items:center}
.brand{font:400 34px 'DM Serif Display'}
.links{margin-left:80px;display:flex;gap:40px;font:600 22px Inter;color:#A9C7B8}
.links b{color:#fff}
.btn{margin-left:auto;background:#D9F99D;color:#0E3B2E;border-radius:999px;font:700 22px Inter;padding:14px 26px}
.photo{position:absolute;left:60px;top:150px;width:700px;height:520px;border-radius:30px;overflow:hidden}
.left{position:absolute;left:60px;top:700px;width:700px}
h1{font:400 92px/1 'DM Serif Display';letter-spacing:-.015em}
h1 em{color:#D9F99D}
.sub{font:500 26px Inter;color:#B9D3C6;margin-top:16px}
.ov{position:absolute;left:24px;bottom:24px;background:rgba(255,255,255,.95);color:#0E3B2E;border-radius:20px;padding:16px 22px;display:flex;align-items:center;gap:14px;font:700 22px Inter}
.ov i{width:44px;height:44px;border-radius:12px;background:#0E3B2E;display:grid;place-items:center}
.ov small{display:block;font:500 17px Inter;color:#4B6B5E}
.tagp{position:absolute;right:24px;top:24px;background:#0E3B2E;color:#D9F99D;border-radius:999px;font:700 19px Inter;padding:10px 18px}
.leads{position:absolute;right:60px;top:150px;width:720px;height:800px;background:#F6EFE2;border-radius:30px;padding:30px;color:#12261F}
.lh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.lh b{font:400 44px 'DM Serif Display'}
.lh span{font:700 20px Inter;color:#3F6B57;background:#E4EEDB;border-radius:999px;padding:8px 16px}
.row{display:flex;align-items:center;gap:18px;padding:18px 6px;border-top:2px solid #E5DCCB}
.row .a{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 22px Inter;color:#fff;flex:none}
.row .t{flex:1}
.row .t b{font:700 25px Inter;display:block}
.row .t small{font:500 19px Inter;color:#5E7469}
.q{display:flex;align-items:center;gap:8px;background:#0E3B2E;color:#D9F99D;border-radius:999px;font:700 19px Inter;padding:10px 16px 10px 12px}
</style></head><body>
<div class="top">
  <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0E3B2E" stroke-width="2.4" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9H3z"/><path d="M10 20v-6h4v6"/></svg></div>
  <div class="brand">Homes &amp; Keys</div>
  <div class="links"><b>Leads</b><span>Listings</span><span>Viewings</span></div>
  <div class="btn">+ New listing</div>
</div>
<div class="photo">
  <svg width="700" height="520" viewBox="0 0 700 520">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CC6F2"/><stop offset=".65" stop-color="#CFEAF7"/><stop offset="1" stop-color="#F8E7C8"/></linearGradient>
      <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DBB5A"/><stop offset="1" stop-color="#3F7D3A"/></linearGradient>
      <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9E4DA"/></linearGradient>
    </defs>
    <rect width="700" height="520" fill="url(#sky)"/>
    <circle cx="560" cy="90" r="46" fill="#FFF6D5"/>
    <ellipse cx="160" cy="300" rx="190" ry="70" fill="#9CCB8A"/>
    <ellipse cx="600" cy="310" rx="200" ry="60" fill="#8FC47D"/>
    <rect y="330" width="700" height="190" fill="url(#lawn)"/>
    <circle cx="90" cy="250" r="70" fill="#3E7B3F"/><circle cx="140" cy="290" r="55" fill="#4F8F45"/><rect x="104" y="300" width="14" height="60" fill="#5B3A22"/>
    <circle cx="615" cy="255" r="62" fill="#3E7B3F"/><circle cx="570" cy="295" r="45" fill="#4F8F45"/><rect x="607" y="300" width="14" height="55" fill="#5B3A22"/>
    <rect x="200" y="210" width="300" height="150" fill="url(#wall)"/>
    <polygon points="180,215 350,110 520,215" fill="#B4532A"/>
    <polygon points="196,215 350,124 504,215" fill="#C8643A"/>
    <rect x="430" y="120" width="30" height="60" fill="#8A3B1D"/>
    <rect x="325" y="270" width="52" height="90" rx="4" fill="#1F4E3D"/><circle cx="367" cy="318" r="4" fill="#E8C770"/>
    <rect x="225" y="245" width="70" height="60" rx="4" fill="#9BD3F0" stroke="#fff" stroke-width="6"/>
    <rect x="405" y="245" width="70" height="60" rx="4" fill="#9BD3F0" stroke="#fff" stroke-width="6"/>
    <rect x="320" y="165" width="60" height="44" rx="22" fill="#9BD3F0" stroke="#fff" stroke-width="6"/>
    <path d="M300 360 L250 520 H450 L402 360z" fill="#E9DFC9"/>
    <circle cx="215" cy="350" r="22" fill="#E26D8C"/><circle cx="485" cy="350" r="22" fill="#E26D8C"/><circle cx="240" cy="356" r="16" fill="#F4A3B8"/><circle cx="462" cy="356" r="16" fill="#F4A3B8"/>
  </svg>
  <div class="tagp">For sale · 3 bed</div>
  <div class="ov"><i><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D9F99D" stroke-width="2.6" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></i><div>6 viewings booked<small>Saturday, 10 AM to 4 PM</small></div></div>
</div>
<div class="left">
  <h1>Buyers, <em>qualified</em><br>while you sleep.</h1>
</div>
<div class="leads">
  <div class="lh"><b>New leads</b><span>Today</span></div>
  <div id="r"></div>
</div>
<script>
const L=[['#C2410C','RP','Rachel P.','Wants 3 bed · ready to view'],['#0369A1','TN','Tom N.','First home · pre-approved'],['#7C3AED','AG','Alicia G.','Moving in spring'],['#047857','KB','Ken B.','Garden + garage'],['#BE185D','SM','Sofia M.','Viewing booked Sat'],['#B45309','JO','James O.','Near good schools']];
document.getElementById('r').innerHTML=L.map(l=>`<div class="row"><div class="a" style="background:${l[0]}">${l[1]}</div><div class="t"><b>${l[2]}</b><small>${l[3]}</small></div><div class="q"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D9F99D" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Qualified</div></div>`).join('');
</script>
</body></html>
