<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1000px;overflow:hidden}
body{font-family:Inter,sans-serif;background:#C8361D;color:#FFF4E6;position:relative}
body:before{content:"";position:absolute;right:-260px;top:-60px;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,#E2582E 0%,rgba(226,88,46,0) 62%)}
.top{position:relative;height:100px;display:flex;align-items:center;padding:0 60px;gap:16px}
.brand{font:600 36px 'Fraunces';font-style:italic;letter-spacing:-.01em}
.links{margin-left:70px;display:flex;gap:40px;font:600 22px Inter;color:#FFD3BF}
.btn{margin-left:auto;background:#FFF4E6;color:#A12812;border-radius:999px;font:700 22px Inter;padding:14px 28px}
.left{position:absolute;left:60px;top:180px;width:640px}
.eyebrow{font:700 21px Inter;letter-spacing:.18em;color:#FFC7AE}
h1{font:600 112px/.95 'Fraunces';letter-spacing:-.035em;margin-top:22px}
h1 em{font-style:italic;color:#FFD08A}
.sub{font:500 28px/1.38 Inter;color:#FFDCCB;margin-top:26px;width:520px}
.res{position:absolute;left:60px;bottom:56px;display:flex;gap:18px}
.r{background:#FFF4E6;color:#3A0D04;border-radius:22px;padding:18px 22px;width:250px}
.r b{font:700 24px Inter;display:block}
.r small{font:500 19px Inter;color:#8A4A35;display:block;margin-top:4px}
.r span{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#DCFCE7;color:#166534;font:700 18px Inter;border-radius:999px;padding:6px 12px}
.plate{position:absolute;right:120px;top:150px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle at 45% 40%,#FFFFFF 0%,#F4ECE4 55%,#E2D6CA 70%,#FFFFFF 71%,#F1E7DC 100%);box-shadow:0 50px 80px rgba(80,10,0,.45),inset 0 -10px 30px rgba(0,0,0,.08);display:grid;place-items:center}
.plate .food{font-size:330px;line-height:1;filter:drop-shadow(0 20px 18px rgba(80,20,0,.35));transform:rotate(-8deg)}
.herb{position:absolute;font-size:80px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.25))}
.card{position:absolute;right:70px;bottom:70px;background:#fff;color:#3A0D04;border-radius:26px;padding:22px 26px;display:flex;align-items:center;gap:18px;box-shadow:0 24px 50px rgba(60,10,0,.35)}
.card i{width:64px;height:64px;border-radius:18px;background:#C8361D;display:grid;place-items:center}
.card b{font:700 26px Inter;display:block}
.card small{font:600 20px Inter;color:#16A34A}
</style></head><body>
<div class="top">
  <div class="brand">Trattoria Rosa</div>
  <div class="links"><span>Menu</span><span>Reservations</span><span>Private dining</span></div>
  <div class="btn">Book a table</div>
</div>
<div class="left">
  <div class="eyebrow">RESERVATIONS · TONIGHT</div>
  <h1>Fully booked,<br><em>every night.</em></h1>
  <p class="sub">Tables confirmed and reminders sent, even after closing.</p>
</div>
<div class="plate"><div class="food">🍝</div></div>
<div class="herb" style="right:690px;top:170px">🍷</div>
<div class="herb" style="right:80px;top:150px;font-size:70px">🌿</div>
<div class="herb" style="right:640px;top:640px;font-size:66px">🍋</div>
<div class="res">
  <div class="r"><b>Table for 4</b><small>7:30 PM · Garcia</small><span>✓ Confirmed</span></div>
  <div class="r"><b>Table for 2</b><small>8:00 PM · Chen</small><span>✓ Confirmed</span></div>
</div>
<div class="card"><i><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a3 3 0 0 0 3 3v7M10 3v6M4 3v6a3 3 0 0 0 3 3M17 21V3c-2 1-3 4-3 8h3"/></svg></i><div><b>Birthday dinner, 6 guests</b><small>✓ Confirmed by text</small></div></div>
</body></html>
