<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1000px;overflow:hidden}
body{font-family:Inter,sans-serif;background:#FFE9DA;color:#3B1405;position:relative}
body:before{content:"";position:absolute;right:-120px;top:-160px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,#FFC59E 0%,rgba(255,197,158,0) 70%)}
.top{position:relative;height:100px;display:flex;align-items:center;padding:0 60px;gap:18px}
.logo{width:54px;height:54px;border-radius:50%;background:#F2581B;display:grid;place-items:center}
.brand{font:800 32px 'Bricolage Grotesque';letter-spacing:-.02em}
.links{display:flex;gap:40px;margin-left:70px;font:600 23px Inter;color:#8A4A2B}
.links b{color:#3B1405;border-bottom:4px solid #F2581B;padding-bottom:6px}
.cart{margin-left:auto;width:60px;height:60px;border-radius:50%;background:#fff;display:grid;place-items:center;position:relative}
.cart span{position:absolute;right:-6px;top:-6px;background:#F2581B;color:#fff;font:800 18px Inter;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:3px solid #FFE9DA}
.left{position:absolute;left:60px;top:190px;width:560px}
.badge{display:inline-flex;align-items:center;gap:10px;background:#F2581B;color:#fff;font:700 22px Inter;border-radius:999px;padding:10px 22px}
.badge i{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.35)}
h1{font:800 112px/.93 'Bricolage Grotesque';letter-spacing:-.04em;margin-top:30px}
h1 em{font-style:normal;color:#F2581B}
.sub{font:500 29px/1.38 Inter;color:#7A3B1E;margin-top:28px;width:500px}
.ticks{margin-top:36px;display:flex;flex-direction:column;gap:14px}
.ticks div{display:flex;align-items:center;gap:14px;font:600 24px Inter}
.ticks svg{background:#3B1405;border-radius:50%;padding:6px}
.grid{position:absolute;left:660px;top:120px;display:grid;grid-template-columns:420px 420px;gap:28px}
.card{background:#fff;border-radius:30px;padding:18px;box-shadow:0 18px 40px rgba(122,52,14,.12)}
.ph{height:250px;border-radius:22px;display:grid;place-items:center;position:relative;overflow:hidden}
.ph span{font-size:150px;line-height:1;filter:drop-shadow(0 18px 18px rgba(0,0,0,.18))}
.ph em{position:absolute;left:16px;top:16px;font:800 19px Inter;font-style:normal;background:#F2581B;color:#fff;border-radius:999px;padding:8px 16px;letter-spacing:.02em}
.meta{padding:16px 8px 6px}
.meta b{font:700 26px 'Bricolage Grotesque';letter-spacing:-.01em;display:block}
.meta p{font:600 20px Inter;color:#16A34A;margin-top:8px;display:flex;align-items:center;gap:8px}
.toast{position:absolute;left:60px;bottom:64px;background:#3B1405;color:#fff;border-radius:22px;padding:18px 26px 18px 18px;display:flex;align-items:center;gap:16px;box-shadow:0 20px 40px rgba(59,20,5,.3);z-index:3}
.toast i{width:52px;height:52px;border-radius:14px;background:#F2581B;display:grid;place-items:center;font-size:28px;font-style:normal}
.toast b{font:700 22px Inter;display:block}
.toast small{font:500 18px Inter;color:#FFC9A8}
</style></head><body>
<div class="top">
  <div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2" stroke-linecap="round"/></svg></div>
  <div class="brand">Shop</div>
  <div class="links"><b>Orders</b><span>Products</span><span>Customers</span></div>
  <div class="cart"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3B1405" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><span>4</span></div>
</div>
<div class="toast"><i>🛍️</i><div><b>New order from Lisa M.</b><small>Confirmed and packed for you</small></div></div>
<div class="left">
  <div class="badge"><i></i>Store open 24/7</div>
  <h1>New order.<br><em>Already<br>on its way.</em></h1>
  <p class="sub">Confirmations, tracking and thank-you notes, sent for you.</p>
</div>
<div class="grid" id="g"></div>
<script>
const items=[
 ['🕯️','linear-gradient(140deg,#FFD7B5,#FF9F6B)','Amber soy candle','Packed · ships today'],
 ['☕','linear-gradient(140deg,#FDE2C8,#E8A27C)','Ceramic mug set','Tracking sent'],
 ['👟','linear-gradient(140deg,#FFE3D3,#FF7A59)','Everyday sneakers','Thank-you note sent'],
 ['🪴','linear-gradient(140deg,#E8F3D9,#B9DB8E)','Mini olive tree','Packed · ships today'],
];
document.getElementById('g').innerHTML=items.map(i=>`<div class="card"><div class="ph" style="background:${i[1]}"><em>NEW ORDER</em><span>${i[0]}</span></div><div class="meta"><b>${i[2]}</b><p><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>${i[3]}</p></div></div>`).join('');
</script>
</body></html>
