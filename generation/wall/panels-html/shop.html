<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_panel.css">
<style>
body{--bg:linear-gradient(150deg,#FDEBDD 0%,#F8D3BC 100%);color:#2A1408}
body::before{content:"";position:absolute;left:-200px;top:-220px;width:900px;height:900px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.85),rgba(255,255,255,0))}
.left{position:absolute;left:64px;top:60px;width:720px}
.left .live{--pill:#fff;box-shadow:0 6px 18px rgba(150,60,10,.1)}
.left h1{margin-top:70px;font-size:100px}
.left h1 em{font-style:normal;color:#EA580C}
.left .sub{margin-top:26px;width:560px;color:#7A4A30}
.grid{position:absolute;left:840px;top:60px;width:696px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.o{height:429px;border-radius:32px;background:#fff;padding:18px;box-shadow:0 30px 60px -30px rgba(120,50,10,.45)}
.o .ph{position:relative;height:250px;border-radius:22px;display:grid;place-items:center;overflow:hidden}
.o .ph svg{width:150px;height:150px}
.o b{display:block;margin:20px 6px 0;font:700 25px/1.2 Inter}
.o .tag{margin:14px 4px 0}
.o .lab{position:absolute;left:12px;top:12px;padding:8px 14px;border-radius:999px;background:#fff;font:800 16px/1 Inter;letter-spacing:.08em;color:#EA580C}
</style></head><body>
<div class="left">
  <div class="who">
    <div class="face" data-shell="#FDBA74" data-rim="#EA580C" data-eye="#FFF1E6" data-mood="round" data-icon="box" data-extra="ears" data-shadow=".22"></div>
    <div><b>Orders agent</b><span class="live">Packing orders</span></div>
  </div>
  <h1>9 orders packed<br><em>and on their way.</em></h1>
  <p class="sub">Confirmations, tracking and thank-you notes, sent for you.</p>
</div>
<div class="grid">
  <div class="o"><div class="ph" style="background:#FDE7D3"><span class="lab">NEW ORDER</span><svg viewBox="0 0 100 100"><rect x="30" y="34" width="40" height="52" rx="8" fill="#F5D0A9"/><rect x="30" y="34" width="40" height="12" rx="6" fill="#E9B98A"/><path d="M50 30c-6-8 0-16 0-16s6 8 0 16z" fill="#F59E0B"/></svg></div><b>Amber soy candle</b><span class="tag g"><i class="ic" data-i="check" data-w="3.2"></i>Shipped</span></div>
  <div class="o"><div class="ph" style="background:#EDE4DA"><span class="lab">NEW ORDER</span><svg viewBox="0 0 100 100"><path d="M26 34h40v34a14 14 0 0 1-14 14H40a14 14 0 0 1-14-14z" fill="#fff" stroke="#C9B8A6" stroke-width="3"/><path d="M66 42h6a9 9 0 0 1 0 18h-6" fill="none" stroke="#C9B8A6" stroke-width="5"/><path d="M38 26c0-6 6-6 6-12M50 26c0-6 6-6 6-12" fill="none" stroke="#C9B8A6" stroke-width="3" stroke-linecap="round"/></svg></div><b>Ceramic mug set</b><span class="tag g"><i class="ic" data-i="check" data-w="3.2"></i>Tracking sent</span></div>
  <div class="o"><div class="ph" style="background:#DCEBFF"><span class="lab">NEW ORDER</span><svg viewBox="0 0 100 100"><path d="M14 66c0-10 6-14 14-16l14-14c4-4 10-2 12 2l6 10c10 2 26 4 30 12v8H14z" fill="#3B82F6"/><rect x="14" y="70" width="76" height="10" rx="5" fill="#fff" stroke="#93C5FD" stroke-width="3"/></svg></div><b>Everyday sneakers</b><span class="tag g"><i class="ic" data-i="check" data-w="3.2"></i>Shipped</span></div>
  <div class="o"><div class="ph" style="background:#DFF3E4"><span class="lab">NEW ORDER</span><svg viewBox="0 0 100 100"><path d="M34 62h32l-4 24H38z" fill="#C2703D"/><path d="M50 62C50 42 36 36 28 38c2 12 12 20 22 24zM50 62c0-22 14-30 24-28-2 14-12 24-24 28zM50 62V30" fill="#22A35A" stroke="#15803D" stroke-width="2"/></svg></div><b>Mini olive tree</b><span class="tag w"><i class="sp" data-c="#D97706" data-t="#FDE68A" data-p=".3" style="width:22px;height:22px"></i>Packing</span></div>
</div>
<script src="_agent.js"></script>
</body></html>
