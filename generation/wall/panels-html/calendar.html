<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1000px;overflow:hidden}
body{font-family:Inter,sans-serif;background:#F4F1FF;color:#1E1B4B;position:relative}
.top{height:96px;display:flex;align-items:center;padding:0 56px;gap:20px;border-bottom:2px solid #E6E0FB;background:#fff}
.logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#7C3AED,#4F46E5);display:grid;place-items:center}
.brand{font:700 30px 'Inter Tight';letter-spacing:-.02em}
.seg{margin-left:auto;display:flex;background:#F1EEFD;border-radius:14px;padding:6px}
.seg span{font:600 22px Inter;padding:10px 24px;border-radius:10px;color:#6B6894}
.seg .on{background:#fff;color:#1E1B4B;box-shadow:0 2px 6px rgba(60,40,140,.12)}
.av{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#F472B6,#FB923C);color:#fff;font:700 22px Inter;display:grid;place-items:center;margin-left:18px}
.left{position:absolute;left:56px;top:150px;width:520px}
.chip{display:inline-flex;align-items:center;gap:10px;background:#fff;border:2px solid #E3DBFF;border-radius:999px;padding:10px 20px 10px 12px;font:600 22px Inter;color:#5B21B6}
.chip i{width:30px;height:30px;border-radius:50%;background:#7C3AED;display:grid;place-items:center}
h1{font:800 100px/0.96 'Inter Tight';letter-spacing:-.045em;margin-top:34px;color:#1E1B4B}
h1 em{font-style:normal;background:linear-gradient(90deg,#7C3AED,#DB2777);-webkit-background-clip:text;color:transparent}
.sub{font:500 29px/1.35 Inter;color:#5A5784;margin-top:30px;width:470px}
.who{display:flex;align-items:center;margin-top:44px}
.who b{width:62px;height:62px;border-radius:50%;border:4px solid #F4F1FF;margin-left:-14px;display:grid;place-items:center;font:700 21px Inter;color:#fff}
.who b:first-child{margin-left:0}
.who p{font:700 25px Inter;margin-left:18px;color:#1E1B4B}
.who p span{display:block;font:500 20px Inter;color:#6B6894;margin-top:2px}
.cal{position:absolute;left:590px;top:132px;width:970px;height:830px;background:#fff;border-radius:28px;box-shadow:0 20px 50px rgba(76,29,149,.12);overflow:hidden}
.days{display:grid;grid-template-columns:70px repeat(5,1fr);height:96px;border-bottom:2px solid #EEEAFB}
.days div{display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 19px Inter;color:#8A87A8;letter-spacing:.06em}
.days div b{font:700 30px 'Inter Tight';color:#1E1B4B;letter-spacing:0;margin-top:4px}
.days .today b{background:#7C3AED;color:#fff;width:50px;height:50px;border-radius:50%;display:grid;place-items:center}
.grid{position:absolute;left:0;top:96px;right:0;bottom:0}
.hr{position:absolute;left:0;right:0;border-top:2px solid #F3F0FC;font:500 17px Inter;color:#A3A0BD}
.hr span{position:absolute;left:14px;top:-11px;background:#fff;padding-right:6px}
.ev{position:absolute;border-radius:14px;padding:10px 12px;overflow:hidden;border-left:7px solid;white-space:nowrap}
.ev b{display:block;font:700 21px Inter;letter-spacing:-.015em}
.ev small{display:block;font:500 17px Inter;margin-top:3px;opacity:.8}
.now{position:absolute;left:70px;right:0;height:3px;background:#EF4444}
.now:before{content:"";position:absolute;left:-7px;top:-6px;width:15px;height:15px;border-radius:50%;background:#EF4444}
</style></head><body>
<div class="top">
  <div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
  <div class="brand">Calendar</div>
  <div style="font:600 24px Inter;color:#6B6894;margin-left:40px">October 20 – 24</div>
  <div class="seg"><span>Day</span><span class="on">Week</span><span>Month</span></div>
  <div class="av">JM</div>
</div>
<div class="left">
  <div class="chip"><i><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.4 6.9L21 11l-6.6 2.1L12 20l-2.4-6.9L3 11l6.6-2.1z"/></svg></i>Booked by your assistant</div>
  <h1>Your week,<br><em>fully booked.</em></h1>
  <p class="sub">New calls land on your calendar while you sleep.</p>
  <div class="who">
    <b style="background:#7C3AED">SK</b><b style="background:#EC4899">DR</b><b style="background:#0EA5E9">PS</b><b style="background:#F59E0B">LM</b>
    <p>14 calls booked<span>this week, no back-and-forth</span></p>
  </div>
</div>
<div class="cal">
  <div class="days">
    <div></div>
    <div>MON<b>20</b></div><div>TUE<b>21</b></div><div class="today">WED<b>22</b></div><div>THU<b>23</b></div><div>FRI<b>24</b></div>
  </div>
  <div class="grid" id="g"></div>
</div>
<script>
const g=document.getElementById('g');
const H=91, colW=(970-70)/5;
['9 AM','10 AM','11 AM','12 PM','1 PM','2 PM','3 PM','4 PM','5 PM'].forEach((t,i)=>{
  const d=document.createElement('div');d.className='hr';d.style.top=(i*H+14)+'px';d.innerHTML='<span>'+t+'</span>';g.appendChild(d);
});
const C={v:['#EDE9FE','#7C3AED','#4C1D95'],p:['#FCE7F3','#EC4899','#831843'],s:['#E0F2FE','#0EA5E9','#0C4A6E'],a:['#FEF3C7','#F59E0B','#78350F'],g:['#DCFCE7','#22C55E','#14532D']};
const ev=[
 [0,0,1,'v','Sarah K.'],[0,2,1,'p','Daniel R.'],[0,5,1.5,'s','Priya S.'],
 [1,.5,1,'a','Leo M.'],[1,3,1,'g','Ana P.'],[1,6,1,'v','Chris T.'],
 [2,1,1.5,'p','Maya L.'],[2,4,1,'s','Tom B.'],[2,6.5,1,'g','Nina F.'],
 [3,0,1,'g','Omar H.'],[3,2.5,1,'v','Julia W.'],[3,5.5,1,'a','Ben C.'],
 [4,1,1,'s','Grace O.'],[4,3.5,1.5,'v','Ryan D.'],[4,6.5,1,'p','Elle V.']
];
const fmt=h=>{const t=9+h;const hh=Math.floor(t),mm=Math.round((t-hh)*60);const h12=hh>12?hh-12:hh;return h12+':'+String(mm).padStart(2,'0')};
ev.forEach(([d,s,len,c,n])=>{
  const e=document.createElement('div');e.className='ev';
  e.style.left=(70+d*colW+7)+'px';e.style.width=(colW-14)+'px';
  e.style.top=(s*H+18)+'px';e.style.height=(len*H-8)+'px';
  e.style.background=C[c][0];e.style.borderColor=C[c][1];e.style.color=C[c][2];
  e.innerHTML='<b>Call booked</b><small>'+n+' · '+fmt(s)+'</small>';g.appendChild(e);
});
const now=document.createElement('div');now.className='now';now.style.top=(3.6*H+14)+'px';g.appendChild(now);
</script>
</body></html>
